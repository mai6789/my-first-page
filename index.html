<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>سورة الإخلاص</title>
  <style>
    body {
      background: #fff8dc;
      font-family: Arial;
      direction: rtl;
      text-align: center;
      color: darkblue;
      padding: 50px;
    }
    .box {
      border: 2px solid darkblue;
      border-radius: 10px;
      padding: 20px;
      display: inline-block;
      font-size: 22px;
    }
    .title {
      font-weight: bold;
      margin-bottom: 15px;
      color: brown;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="title">سورة الإخلاص</div>
    بسم الله الرحمن الرحيم<br>
    قل هو الله أحد<br>
    الله الصمد<br>
    لم يلد ولم يولد<br>
    ولم يكن له كفوا أحد
  </div>

</body>
</html>
